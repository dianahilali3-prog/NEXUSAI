/* v0.2.0 — accessible settings and async feedback */
.settings-input{width:100%;min-height:48px;border:1px solid rgba(208,157,188,.28);border-radius:14px;background:rgba(255,255,255,.055);color:inherit;padding:12px 14px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.settings-input:focus{border-color:#df8ab5;box-shadow:0 0 0 3px rgba(223,138,181,.13)}
.settings-input::placeholder{color:rgba(255,255,255,.38)}
.secondary-button{border:1px solid rgba(219,169,196,.35);border-radius:14px;background:rgba(255,255,255,.06);color:inherit;min-height:46px;padding:10px 16px;font:inherit;font-weight:650;cursor:pointer;transition:background .2s,border-color .2s}
.secondary-button:hover{background:rgba(223,138,181,.12);border-color:#df8ab5}
.send-button:disabled{opacity:.48;cursor:not-allowed}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:nexus-spin .7s linear infinite}
@keyframes nexus-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

.image-grid{display:grid;gap:12px;margin-bottom:16px}.image-card{border:1px solid var(--line);border-radius:13px;padding:10px;background:rgba(255,255,255,.025)}.image-frame{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:rgba(8,5,10,.35);display:grid;place-items:center}.image-frame img{width:100%;height:100%;object-fit:cover}.image-status{display:flex;align-items:center;gap:8px;font-size:10px;color:#c7b1c2;padding:14px;text-align:center}.image-card p{font-size:9px;color:#a991a3;margin:8px 2px;overflow-wrap:anywhere}a.secondary-button{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:10px}.secondary-button{display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px}

/* v0.3 — lisibilité mobile, puces, cartes d'images, agents actifs */
.message-bubble{white-space:pre-wrap;overflow-wrap:anywhere}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.04);color:#d8c4d1;padding:9px 14px;font-size:12px;min-height:38px}
.chip.on{border-color:rgba(236,156,192,.55);background:rgba(208,105,153,.2);color:#f6c3da}
.card-actions{display:flex;gap:8px}
.card-actions .secondary-button{min-height:38px;padding:8px 12px;flex:1}
.card-actions .secondary-button[aria-label]{flex:0 0 auto}
.secondary-button.danger{color:#f0a3b3;border-color:rgba(240,163,179,.35)}
.image-grid.library-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.agent-button{width:100%;text-align:left;color:inherit;font:inherit}
.agent-button.active{border-color:rgba(236,156,192,.5);background:rgba(208,105,153,.1)}
.job-row .icon-button{flex-shrink:0}
